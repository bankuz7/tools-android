name: gen-keystore
on:
  workflow_dispatch:
    inputs:
      store_password: { required: true }
      key_password: { required: true }
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: |
          keytool -genkeypair -keystore release.keystore -storetype JKS \
            -alias toolsapp -keyalg RSA -keysize 2048 -validity 9125 \
            -storepass "${{ inputs.store_password }}" -keypass "${{ inputs.key_password }}" \
            -dname "CN=bankuz7, OU=ToolsApp, O=bankuz7, L=IN, ST=GJ, C=IN"
          keytool -list -keystore release.keystore -storepass "${{ inputs.store_password }}" | head -5
      - uses: actions/upload-artifact@v4
        with: { name: release-keystore, path: release.keystore }
